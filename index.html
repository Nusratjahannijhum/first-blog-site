<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>
       <div class="flex items-center justify-between px-5 py-2 bg-purple-600">
        <div class="w-[40px] h-[40px]">
            <img class="w-full h-full rounded-full" src="/assets/logo.png" alt="">
        </div>

        <nav class="flex text-white">
            <a class="hover:bg-purple-400 px-2 py-1 rounded-md duration-150" href="#home">Home</a>
            <a class="hover:bg-purple-400 px-2 py-1 rounded-md duration-150" href="#about">About</a>
            <a class="hover:bg-purple-400 px-2 py-1 rounded-md duration-150" href="#contact">Contact</a>
        </nav>
       </div>
    </header>
    <main>
        <div class="w-full h-[400px]" style="background: url('https://media.istockphoto.com/id/2082112210/photo/grasslands-and-road.webp?a=1&b=1&s=612x612&w=0&k=20&c=JER32PHS95V3HJGBPHQJd04mRAqZY7YUvU42CB73zSg='); background-repeat: no-repeat; background-size: cover;"></div>

        <div class="w-full my-5">
            <div class="w-full text-center">
                <h2 class="text-[25px] font-semibold border-b border-gray-800 inline-flex">Portfolio</h2>
            </div>
            <div class="w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="group w-full hover:border hover:border-green-600 overflow-hidden">
                    <img class="w-full h-[300px] object-cover group-hover:scale-95 duration-200" src="https://images.unsplash.com/photo-1736519387668-f575715be7e8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8bmF0dXJlJTIwd2FsbHBhcGVyfGVufDB8MHwyfHx8MA%3D%3D" alt="">
                </div>
                <div class="group w-full hover:border hover:border-green-600 overflow-hidden">
                    <img class="w-full h-[300px] object-cover group-hover:scale-95 duration-200" src="https://images.unsplash.com/photo-1736679022598-15b4e35b6df0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fG5hdHVyZSUyMHdhbGxwYXBlcnxlbnwwfDB8Mnx8fDA%3D" alt="">
                </div>
                <div class="group w-full hover:border hover:border-green-600 overflow-hidden">
                    <img class="w-full h-[300px] object-cover group-hover:scale-95 duration-200" src="https://images.unsplash.com/photo-1736707237025-20e90ba843be?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fG5hdHVyZSUyMHdhbGxwYXBlcnxlbnwwfDB8Mnx8fDA%3D" alt="">
                </div>
                <div class="group w-full hover:border hover:border-green-600 overflow-hidden">
                    <img class="w-full h-[300px] object-cover group-hover:scale-95 duration-200" src="https://images.unsplash.com/photo-1736564764955-f1770e94a4e4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjZ8fG5hdHVyZSUyMHdhbGxwYXBlcnxlbnwwfDB8Mnx8fDA%3D" alt="">
                </div>
            </div>
        </div>
    </main>
   
</body>
</html>
